name: deploy-preview-warehouse-test2

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run preview D1 migration on remote"
        required: false
        default: "true"

jobs:
  deploy:
    name: Deploy preview worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare deployment secrets
        run: |
          npm run ci:check-deploy-secrets

      - name: Validate deployment DB migration commands
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_migrations == 'true'
        run: |
          echo "Remote migration will run against production D1 binding configured in wrangler.toml"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production

      - name: Provision initial tables (first run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_migrations == 'true'
        run: |
          npx wrangler d1 execute warehouse-preview-db --env production --remote --file=./src/db/migrations/0001_init.sql
          npx wrangler d1 execute warehouse-preview-db --env production --remote --file=./src/db/migrations/0002_seed.sql

