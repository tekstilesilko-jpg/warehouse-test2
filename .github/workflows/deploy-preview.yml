name: deploy-preview-warehouse-test2

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run preview D1 migration on remote (requires WRANGLER_D1_DATABASE_ID)"
        required: false
        default: "true"

jobs:
  deploy:
    name: Deploy preview worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Provision initial tables (first run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_migrations == 'true'
        env:
          WRANGLER_D1_DATABASE_ID: ${{ secrets.WRANGLER_D1_DATABASE_ID }}
        run: |
          npx wrangler d1 execute $WRANGLER_D1_DATABASE_ID --remote --file=./src/db/migrations/0001_init.sql
          npx wrangler d1 execute $WRANGLER_D1_DATABASE_ID --remote --file=./src/db/migrations/0002_seed.sql
