name = "warehouse-test2-preview"
main = "src/index.ts"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]
send_metrics = true

[[d1_databases]]
binding = "WAREHOUSE_DB"
database_name = "warehouse-preview-db"
database_id = "local-warehouse-preview-db"

[[env.production.d1_databases]]
binding = "WAREHOUSE_DB"
database_name = "warehouse-preview-db"
database_id = "2ba99352-22ef-4514-9514-1f6d08c6ff02"

[observability]
[observability.logs]
enabled = true

[vars]
ENVIRONMENT = "PREVIEW"

[env.production.vars]
ENVIRONMENT = "PREVIEW"

[triggers]
crons = ["0 3 * * *"]
